[project]
name = "ev-track-workflow"
version = "0.2.0"
description = "EV cargo analysis pipeline — scrape EV-TRACK, normalise, PCA/UMAP/clustering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "llvmlite>=0.42",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.6",
]

[project.scripts]
ev-track-workflow = "run_workflow:main"
